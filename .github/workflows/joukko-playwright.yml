name: JOUKKO Playwright review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joukko-staging-playwright-review
  cancel-in-progress: false

env:
  PLAYWRIGHT_BASE_URL: https://joukko-staging.onrender.com
  PLAYWRIGHT_TEST_BASE_URL: https://joukko-staging.onrender.com
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  review:
    name: Full browser and release review
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Confirm workflow started
        run: echo "JOUKKO review started for $GITHUB_SHA"

      - name: Install browser review tools
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Static AI and secret safety checks
        shell: bash
        run: |
          set -e
          grep -q 'if (!aiIsUsable()) return mockAiProvider' src/lib/ai/service.ts
          grep -q 'if (settings.provider === "openai-compatible" && !process.env.OPENAI_API_KEY) return false' src/lib/ai/settings.ts
          if grep -R "NEXT_PUBLIC_OPENAI_API_KEY" src .env.example; then
            echo "OPENAI key must never be public"
            exit 1
          fi
          if grep -R "sk_live_\|sk_test_" src; then
            echo "Secret-like Stripe key found in source"
            exit 1
          fi

      - name: Run browser, UX, auth, accessibility and hardening checks
        run: pnpm exec playwright test tests/joukko-ux.spec.ts tests/joukko-hardening.spec.ts --reporter=line,html

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joukko-playwright-review
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
